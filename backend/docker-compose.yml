services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: business_manager
      POSTGRES_USER: bm_user
      POSTGRES_PASSWORD: change_this_local_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bm_user -d business_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://bm_user:change_this_local_password@db:5432/business_manager
      SECRET_KEY: local-compose-secret-change-before-deployment
      CORS_ORIGINS: http://localhost:8081
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
